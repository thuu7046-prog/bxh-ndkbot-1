<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LỊCH SỬ BẢNG XẾP HẠNG</title>
    <!-- Phông chữ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --badge-bg: #1e293b;
            --chip-bg: rgba(59, 130, 246, 0.15);
            --chip-text: #60a5fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Top Header Bar */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .count-badge {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .count-badge span {
            color: #38bdf8;
        }

        /* Title & Controls */
        .header-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 320px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-input {
            width: 100%;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 10px 12px 10px 36px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #3b82f6;
        }

        /* List Items Layout */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .bxh-card {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Thumbnail Container */
        .img-wrapper {
            position: relative;
            width: 240px;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            background-color: #1e293b;
            flex-shrink: 0;
            cursor: pointer;
            border: 1px solid #1f2937;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Badge số thứ tự nằm đè trên ảnh */
        .rank-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Info Section */
        .info-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 5px;
        }

        .bxh-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f3f4f6;
        }

        .bxh-tag {
            display: inline-block;
            background-color: var(--chip-bg);
            color: var(--chip-text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            width: fit-content;
        }

        /* Lightbox Preview */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }

        @media (max-width: 600px) {
            .bxh-card { flex-direction: column; }
            .img-wrapper { width: 100%; }
            .search-container { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Badge đếm số lượng góc trên phải -->
        <div class="top-bar">
            <div class="count-badge">
                <span id="total-count">0</span> / <span id="max-count">0</span> bảng
            </div>
        </div>

        <!-- Tiêu đề & Ô tìm kiếm -->
        <div class="header-section">
            <h1 class="page-title">LỊCH SỬ BẢNG XẾP HẠNG</h1>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Tìm số BXH...">
            </div>
        </div>

        <!-- Danh sách hiển thị -->
        <div class="list-container" id="gallery-container"></div>
    </div>

    <!-- Lightbox Xem Ảnh Lớn -->
    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <img src="" id="lightbox-img" alt="Xem ảnh lớn">
    </div>

    <script>
        // CẤU HÌNH GITHUB CỦA BẠN TẠI ĐÂY
        const GITHUB_USERNAME = 'TÊN_USER_GITHUB_CỦA_BẠN'; // Ví dụ: 'octocat'
        const REPO_NAME = 'TÊN_REPOSITORY_CỦA_BẠN';       // Ví dụ: 'my-bxh-repo'
        const BRANCH = 'main';                               // Nhánh GitHub (mặc định 'main')

        // Tải danh sách ảnh từ GitHub (Giả định các ảnh đặt tên: 1.png, 2.png, 3.png...)
        const TOTAL_ITEMS = 45; // Thay đổi tổng số lượng ảnh của bạn

        const gallery = document.getElementById('gallery-container');
        const searchInput = document.getElementById('search-input');
        const totalCountEl = document.getElementById('total-count');
        const maxCountEl = document.getElementById('max-count');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        maxCountEl.innerText = TOTAL_ITEMS;

        // Hàm lấy URL đường dẫn trực tiếp ảnh trên GitHub (Raw / CDN)
        function getImageUrl(index) {
            // Sử dụng jsDelivr CDN giúp load ảnh từ GitHub siêu nhanh và không bị giới hạn
            return `https://cdn.jsdelivr.net/gh/${GITHUB_USERNAME}/${REPO_NAME}@${BRANCH}/${index}.png`;
        }

        let itemsData = [];

        function renderList(filterIndex = '') {
            gallery.innerHTML = '';
            let visibleCount = 0;

            itemsData.forEach(item => {
                if (filterIndex !== '' && !item.id.toString().includes(filterIndex)) {
                    return;
                }

                visibleCount++;

                const card = document.createElement('div');
                card.className = 'bxh-card';

                card.innerHTML = `
                    <div class="img-wrapper" onclick="openLightbox('${item.url}')">
                        <span class="rank-number">${item.id}</span>
                        <img src="${item.url}" alt="BXH #${item.id}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x169/1e293b/94a3b8?text=Lỗi+Ảnh';">
                    </div>
                    <div class="info-wrapper">
                        <div class="bxh-title">BXH #${item.id}</div>
                        <div class="bxh-tag">BXH #${item.id}</div>
                    </div>
                `;

                gallery.appendChild(card);
            });

            totalCountEl.innerText = visibleCount;
        }

        // Khởi tạo dữ liệu danh sách
        for (let i = 1; i <= TOTAL_ITEMS; i++) {
            itemsData.push({
                id: i,
                url: getImageUrl(i)
            });
        }

        // Hiển thị ban đầu
        renderList();

        // Xử lý tìm kiếm
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            renderList(val);
        });

        // Mở ảnh lớn
        function openLightbox(url) {
            lightboxImg.src = url;
            lightbox.classList.add('active');
        }
    </script>
</body>
</html>
