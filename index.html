<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BẢNG XẾP HẠNG NDK BOT</title>
    <!-- Phông chữ Sci-Fi Cyberpunk cực chất -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00f0ff;      /* Màu xanh Cyan Neon từ Robot */
            --electric-blue: #0066ff;  /* Màu xanh điện tử */
            --dark-glow: rgba(0, 240, 255, 0.25);
            --bg-dark: #030712;
            --card-bg: rgba(6, 15, 30, 0.85);
            --border-cyan: rgba(0, 240, 255, 0.4);
            --text-main: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark); 
            /* Hình nền Robot Cyberpunk 3D kết hợp Ma Trận Lưới Điện */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.15) 0%, rgba(3, 7, 18, 0.95) 80%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop');
            background-size: cover, 35px 35px, 35px 35px, cover;
            background-repeat: no-repeat, repeat, repeat, no-repeat;
            background-position: center top;
            background-attachment: fixed;
            color: var(--text-main); 
            text-align: center; 
            padding: 40px 20px; 
            min-height: 100vh;
            user-select: none; 
            -webkit-user-select: none;
        }
        
        /* Tiêu đề Robot Mecha Cyan Neon tỏa sáng */
        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 50px; 
            text-shadow: 
                0 0 12px rgba(0, 240, 255, 0.9),
                0 0 30px rgba(0, 240, 255, 0.6),
                0 0 50px rgba(0, 102, 255, 0.4);
            position: relative;
            display: inline-block;
        }

        h1::before {
            content: '⚡ MECHA PROTOCOL ACTIVE ⚡';
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            white-space: nowrap;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--electric-blue), var(--neon-cyan), var(--electric-blue), transparent);
            box-shadow: 0 0 18px var(--neon-cyan);
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            max-width: 1450px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* Thẻ Giáp Robot Vát Góc (Cyber Armor Card) */
        .image-container {
            position: relative;
            width: 320px;
            cursor: pointer; 
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-cyan);
            /* Vát góc phong cách khiên Mecha góc cạnh */
            clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            content-visibility: auto; 
            contain-intrinsic-size: 320px 180px;
        }

        .image-container:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--neon-cyan);
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.5),
                0 0 15px rgba(0, 102, 255, 0.3) inset;
        }

        .image-container img { 
            width: 100%; 
            height: auto; 
            display: block;
            transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
            background-color: rgba(0, 0, 0, 0.7);
            -webkit-user-drag: none;
        }

        .image-container:hover img {
            transform: scale(1.12);
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0, 240, 255, 0.1) 100%);
            pointer-events: none;
        }

        /* Huy hiệu Tag Số thứ tự ở Góc Trái (Định dạng: 01, 02, 03...) */
        .image-number {
            position: absolute;
            top: 0;
            left: 0;
            font-family: 'Chakra Petch', sans-serif;
            background: rgba(3, 7, 18, 0.95);
            color: var(--neon-cyan); 
            padding: 6px 16px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            pointer-events: none; 
            border-bottom: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--electric-blue);
            /* Vát góc dưới phải cho nhãn số */
            clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            z-index: 10;
        }

        /* Lightbox nâng cấp Sci-Fi Overlay */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 4, 10, 0.96);
            backdrop-filter: blur(18px);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000; 
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.4);
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 88vh;
            border-radius: 4px;
            border: 1px solid var(--neon-cyan);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            -webkit-user-drag: none;
        }

        .lightbox-overlay.active .lightbox-image {
            transform: scale(1);
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 35px;
            color: var(--neon-cyan);
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1010;
            transition: all 0.2s;
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        .close-lightbox:hover {
            color: #ffffff;
            transform: scale(1.2) rotate(90deg);
        }

        /* DevTools Warning Frame */
        #devtools-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #02040a;
            color: var(--neon-cyan);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            padding: 20px;
            box-sizing: border-box;
            text-shadow: 0 0 25px var(--neon-cyan);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; letter-spacing: 2px; }
            .image-container { width: 100%; max-width: 340px; }
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <!-- CẢNH BÁO MỞ F12 -->
    <div id="devtools-warning">
        <p>⚠️ ACCESS DENIED / DEVTOOLS DETECTED</p>
        <p style="color: #fff; font-size: 18px; font-family: 'Chakra Petch', sans-serif; font-weight: 600; margin-top: 15px;">
            Vui lòng tắt DevTools (F12) để tiếp tục xem nội dung!
        </p>
    </div>

    <div id="main-content">
        <h1>BẢNG XẾP HẠNG NDK BOT</h1>
        <div class="gallery" id="gallery-container"></div>
    </div>

    <!-- KHUNG LIGHTBOX -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <div class="lightbox-wrapper">
            <img src="" alt="Ảnh lớn" class="lightbox-image" id="lightbox-img">
            <div class="image-overlay"></div>
        </div>
    </div>

    <script>
        const warningEl = document.getElementById('devtools-warning');
        const mainContentEl = document.getElementById('main-content');
        const gallery = document.getElementById('gallery-container');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        const blobCache = {};

        function detectDevTools() {
            const threshold = 160;
            const widthDiff = window.outerWidth - window.innerWidth > threshold;
            const heightDiff = window.outerHeight - window.innerHeight > threshold;
            
            if (widthDiff || heightDiff) {
                warningEl.style.display = 'flex';
                mainContentEl.style.display = 'none';
            } else {
                warningEl.style.display = 'none';
                mainContentEl.style.display = 'block';
            }
        }

        window.addEventListener('resize', detectDevTools);
        setInterval(detectDevTools, 1000);

        async function fetchAndCreateBlobUrl(imageSrc) {
            try {
                const response = await fetch(imageSrc);
                if (!response.ok) return null;
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                blobCache[imageSrc] = blobUrl;
                return blobUrl;
            } catch (e) {
                return null;
            }
        }

        const fragment = document.createDocumentFragment();

        for (let i = 1; i <= 200; i++) {
            const div = document.createElement('div');
            div.className = 'image-container';

            const fileName = i + '.png';

            const img = document.createElement('img');
            img.alt = 'Bảng ' + i;
            img.loading = 'lazy';

            fetchAndCreateBlobUrl(fileName).then(blobUrl => {
                if (blobUrl) {
                    img.src = blobUrl;
                } else {
                    div.style.display = 'none';
                }
            });

            div.onclick = function() {
                if (blobCache[fileName]) {
                    openLightbox(blobCache[fileName]);
                }
            };

            const overlay = document.createElement('div');
            overlay.className = 'image-overlay';

            const numberSpan = document.createElement('span');
            numberSpan.className = 'image-number';
            // Định dạng hiển thị dạng 01, 02, 03... thay vì #01
            numberSpan.innerText = i < 10 ? '0' + i : i; 

            div.appendChild(img);
            div.appendChild(overlay);
            div.appendChild(numberSpan);
            fragment.appendChild(div);
        }

        gallery.appendChild(fragment);

        function openLightbox(blobUrl) {
            lightboxImg.src = blobUrl; 
            lightbox.classList.add('active'); 
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.classList.remove('active'); 
            document.body.style.overflow = ''; 
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        }

        closeBtn.onclick = closeLightbox;

        lightbox.onclick = function(e) {
            if (e.target !== lightboxImg) {
                closeLightbox();
            }
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
