<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LỊCH SỬ BẢNG XẾP HẠNG</title>
    <!-- Phông chữ chuẩn UI giao diện mẫu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #0d121f;
            --border-color: #1a2336;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --badge-bg: rgba(15, 23, 42, 0.8);
            --pill-bg: rgba(14, 165, 233, 0.12);
            --pill-text: #38bdf8;
            --pill-border: rgba(56, 189, 248, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Top Header Badge */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .count-badge {
            background-color: #0d1527;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .count-badge span {
            color: #f8fafc;
            font-weight: 700;
        }

        /* Title & Search Controls */
        .header-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #94a3b8;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: flex-end;
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 220px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 13px;
        }

        .search-input {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 12px 8px 34px;
            color: #f8fafc;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 1px #38bdf8;
        }

        .filter-btn {
            background-color: #0b0f19;
            border: 1px solid #1e293b;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* List Items Layout */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .bxh-card {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* Thumbnail Container */
        .img-wrapper {
            position: relative;
            width: 260px;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background-color: #0f172a;
            flex-shrink: 0;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .img-wrapper:hover {
            transform: translateY(-2px);
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Badge số thứ tự vuông góc trái ảnh */
        .rank-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Right Info Section */
        .info-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 4px;
        }

        .bxh-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .bxh-pill {
            display: inline-flex;
            align-items: center;
            background-color: var(--pill-bg);
            color: var(--pill-text);
            border: 1px solid var(--pill-border);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            width: fit-content;
        }

        /* Lightbox Preview */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 92%; max-height: 92%; border-radius: 8px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); }

        .loading-text {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            padding: 40px 0;
        }

        @media (max-width: 640px) {
            .bxh-card { flex-direction: column; }
            .img-wrapper { width: 100%; }
            .header-section { flex-direction: column; align-items: flex-start; }
            .controls-group { width: 100%; }
            .search-container { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Badge tổng số bảng -->
        <div class="top-bar">
            <div class="count-badge">
                <span id="total-count">0</span> / <span id="max-count">0</span> bảng
            </div>
        </div>

        <!-- Tiêu đề & Ô tìm kiếm -->
        <div class="header-section">
            <h1 class="page-title">LỊCH SỬ BẢNG XẾP HẠNG</h1>
            <div class="controls-group">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" class="search-input" placeholder="Tìm số BXH...">
                </div>
                <button class="filter-btn"></button>
            </div>
        </div>

        <!-- Danh sách hiển thị -->
        <div class="list-container" id="gallery-container">
            <div class="loading-text">Đang tải dữ liệu từ GitHub...</div>
        </div>
    </div>

    <!-- Lightbox Xem Ảnh Lớn -->
    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <img src="" id="lightbox-img" alt="Xem ảnh lớn">
    </div>

    <script>
        // CẤU HÌNH GITHUB CỦA BẠN TẠI ĐÂY
        const GITHUB_USERNAME = 'TÊN_USER_GITHUB_CỦA_BẠN'; // Thay bằng username GitHub
        const REPO_NAME = 'TÊN_REPOSITORY_CỦA_BẠN';       // Thay bằng tên Repo chứa ảnh
        const BRANCH = 'main';                               // Nhánh GitHub (mặc định 'main')

        const gallery = document.getElementById('gallery-container');
        const searchInput = document.getElementById('search-input');
        const totalCountEl = document.getElementById('total-count');
        const maxCountEl = document.getElementById('max-count');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        let allItems = [];

        // Lấy danh sách ảnh tự động bằng GitHub API (Không giới hạn số lượng)
        async function fetchImagesFromGitHub() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents?ref=${BRANCH}`);
                if (!response.ok) throw new Error('Không thể kết nối GitHub API');
                
                const files = await response.json();

                // Lọc ra các file ảnh (png, jpg, jpeg, webp)
                const imageFiles = files.filter(file => 
                    file.type === 'file' && /\.(png|jpe?g|webp)$/i.test(file.name)
                );

                // Tự động sắp xếp ảnh theo số thứ tự tên file (vd: 1.png, 2.png, 10.png)
                imageFiles.sort((a, b) => {
                    const numA = parseInt(a.name) || 0;
                    const numB = parseInt(b.name) || 0;
                    return numA - numB;
                });

                allItems = imageFiles.map((file, index) => {
                    const idNumber = parseInt(file.name) || (index + 1);
                    return {
                        id: idNumber,
                        // Dùng CDN jsDelivr để load ảnh siêu nhanh
                        url: `https://cdn.jsdelivr.net/gh/${GITHUB_USERNAME}/${REPO_NAME}@${BRANCH}/${file.name}`
                    };
                });

                maxCountEl.innerText = allItems.length;
                renderList();

            } catch (error) {
                gallery.innerHTML = `<div class="loading-text" style="color: #ef4444;">Lỗi tải dữ liệu. Hãy kiểm tra lại Tên User / Repo GitHub trong file index.html!</div>`;
            }
        }

        // Render giao diện danh sách giống ảnh 100%
        function renderList(filterIndex = '') {
            gallery.innerHTML = '';
            let visibleCount = 0;

            allItems.forEach(item => {
                if (filterIndex !== '' && !item.id.toString().includes(filterIndex)) {
                    return;
                }

                visibleCount++;

                const card = document.createElement('div');
                card.className = 'bxh-card';

                card.innerHTML = `
                    <div class="img-wrapper" onclick="openLightbox('${item.url}')">
                        <span class="rank-number">${item.id}</span>
                        <img src="${item.url}" alt="BXH #${item.id}" loading="lazy">
                    </div>
                    <div class="info-wrapper">
                        <div class="bxh-title">BXH #${item.id}</div>
                        <div class="bxh-pill">BXH #${item.id}</div>
                    </div>
                `;

                gallery.appendChild(card);
            });

            totalCountEl.innerText = visibleCount;
        }

        // Xử lý tìm kiếm theo số
        searchInput.addEventListener('input', (e) => {
            renderList(e.target.value.trim());
        });

        // Mở ảnh lớn xem Lightbox
        function openLightbox(url) {
            lightboxImg.src = url;
            lightbox.classList.add('active');
        }

        // Khởi chạy ứng dụng
        fetchImagesFromGitHub();
    </script>
</body>
</html>
