<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BẢNG XẾP HẠNG NDK BOT</title>
    <!-- Font Sci-Fi Mecha cao cấp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-red: #ff003c;     /* Đỏ Laser Chiến Tranh */
            --amber-gold: #ffb700;      /* Vàng Hổ Phách Robot */
            --cyan-accent: #00f0ff;     /* Xanh Điện Tử HUD */
            --bg-dark: #04060a;
            --card-bg: rgba(10, 14, 23, 0.88);
            --border-red: rgba(255, 0, 60, 0.45);
            --text-main: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark); 
            /* Background Robot Chiến Binh Đẳng Cấp + Ma Trận Lưới Cyber */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 0, 60, 0.12) 0%, rgba(4, 6, 10, 0.95) 85%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1920&auto=format&fit=crop');
            background-size: cover, 30px 30px, 30px 30px, cover;
            background-repeat: no-repeat, repeat, repeat, no-repeat;
            background-position: center top;
            background-attachment: fixed;
            color: var(--text-main); 
            text-align: center; 
            padding: 40px 20px; 
            min-height: 100vh;
            user-select: none; 
            -webkit-user-select: none;
        }
        
        /* Tiêu đề Robot Mecha Đỏ / Vàng cực cháy */
        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 50px; 
            text-shadow: 
                0 0 10px rgba(255, 0, 60, 0.9),
                0 0 25px rgba(255, 0, 60, 0.6),
                0 0 45px rgba(255, 183, 0, 0.4);
            position: relative;
            display: inline-block;
        }

        h1::before {
            content: '[ SYSTEM WAR-BOT ONLINE ]';
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--amber-gold);
            text-shadow: 0 0 8px var(--amber-gold);
            white-space: nowrap;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-red), var(--amber-gold), var(--primary-red), transparent);
            box-shadow: 0 0 15px var(--primary-red);
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            max-width: 1450px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* Thẻ Giáp Robot (Mecha Armor Card) */
        .image-container {
            position: relative;
            width: 320px;
            cursor: pointer; 
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-red);
            /* Vát góc 4 phía phong cách khiên giáp chiến binh */
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            content-visibility: auto; 
            contain-intrinsic-size: 320px 180px;
        }

        .image-container:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--amber-gold);
            box-shadow: 
                0 0 25px rgba(255, 0, 60, 0.5),
                0 0 12px rgba(255, 183, 0, 0.3) inset;
        }

        .image-container img { 
            width: 100%; 
            height: auto; 
            display: block;
            transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
            background-color: rgba(0, 0, 0, 0.7);
            -webkit-user-drag: none;
        }

        .image-container:hover img {
            transform: scale(1.12);
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(255, 0, 60, 0.1) 100%);
            pointer-events: none;
        }

        /* Huy hiệu Tag Số thứ tự Robot HUD */
        .image-number {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: 'Chakra Petch', sans-serif;
            background: rgba(4, 6, 10, 0.92);
            color: var(--amber-gold); 
            padding: 4px 14px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 2px;
            pointer-events: none; 
            border-left: 3px solid var(--primary-red);
            border-bottom: 1px solid var(--amber-gold);
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.4);
            z-index: 10;
        }

        /* Lightbox nâng cấp Sci-Fi Overlay */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 3, 6, 0.96);
            backdrop-filter: blur(16px);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000; 
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.4);
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 88vh;
            border-radius: 4px;
            border: 1px solid var(--primary-red);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            -webkit-user-drag: none;
        }

        .lightbox-overlay.active .lightbox-image {
            transform: scale(1);
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 35px;
            color: var(--amber-gold);
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1010;
            transition: all 0.2s;
            text-shadow: 0 0 12px var(--amber-gold);
        }

        .close-lightbox:hover {
            color: var(--primary-red);
            transform: scale(1.2) rotate(90deg);
        }

        /* DevTools Warning Frame */
        #devtools-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #020305;
            color: var(--primary-red);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            padding: 20px;
            box-sizing: border-box;
            text-shadow: 0 0 25px var(--primary-red);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; letter-spacing: 2px; }
            .image-container { width: 100%; max-width: 340px; }
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <!-- CẢNH BÁO MỞ F12 -->
    <div id="devtools-warning">
        <p>⚠️ ACCESSED DENIED / DEVTOOLS DETECTED</p>
        <p style="color: #fff; font-size: 18px; font-family: 'Chakra Petch', sans-serif; font-weight: 600; margin-top: 15px;">
            Vui lòng tắt DevTools (F12) để tiếp tục xem nội dung!
        </p>
    </div>

    <div id="main-content">
        <h1>BẢNG XẾP HẠNG NDK BOT</h1>
        <div class="gallery" id="gallery-container"></div>
    </div>

    <!-- KHUNG LIGHTBOX -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <div class="lightbox-wrapper">
            <img src="" alt="Ảnh lớn" class="lightbox-image" id="lightbox-img">
            <div class="image-overlay"></div>
        </div>
    </div>

    <script>
        const warningEl = document.getElementById('devtools-warning');
        const mainContentEl = document.getElementById('main-content');
        const gallery = document.getElementById('gallery-container');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        const blobCache = {};

        function detectDevTools() {
            const threshold = 160;
            const widthDiff = window.outerWidth - window.innerWidth > threshold;
            const heightDiff = window.outerHeight - window.innerHeight > threshold;
            
            if (widthDiff || heightDiff) {
                warningEl.style.display = 'flex';
                mainContentEl.style.display = 'none';
            } else {
                warningEl.style.display = 'none';
                mainContentEl.style.display = 'block';
            }
        }

        window.addEventListener('resize', detectDevTools);
        setInterval(detectDevTools, 1000);

        async function fetchAndCreateBlobUrl(imageSrc) {
            try {
                const response = await fetch(imageSrc);
                if (!response.ok) return null;
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                blobCache[imageSrc] = blobUrl;
                return blobUrl;
            } catch (e) {
                return null;
            }
        }

        const fragment = document.createDocumentFragment();

        for (let i = 1; i <= 200; i++) {
            const div = document.createElement('div');
            div.className = 'image-container';

            const fileName = i + '.png';

            const img = document.createElement('img');
            img.alt = 'Bảng ' + i;
            img.loading = 'lazy';

            fetchAndCreateBlobUrl(fileName).then(blobUrl => {
                if (blobUrl) {
                    img.src = blobUrl;
                } else {
                    div.style.display = 'none';
                }
            });

            div.onclick = function() {
                if (blobCache[fileName]) {
                    openLightbox(blobCache[fileName]);
                }
            };

            const overlay = document.createElement('div');
            overlay.className = 'image-overlay';

            const numberSpan = document.createElement('span');
            numberSpan.className = 'image-number';
            numberSpan.innerText = '#' + (i < 10 ? '0' + i : i); 

            div.appendChild(img);
            div.appendChild(overlay);
            div.appendChild(numberSpan);
            fragment.appendChild(div);
        }

        gallery.appendChild(fragment);

        function openLightbox(blobUrl) {
            lightboxImg.src = blobUrl; 
            lightbox.classList.add('active'); 
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.classList.remove('active'); 
            document.body.style.overflow = ''; 
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        }

        closeBtn.onclick = closeLightbox;

        lightbox.onclick = function(e) {
            if (e.target !== lightboxImg) {
                closeLightbox();
            }
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
