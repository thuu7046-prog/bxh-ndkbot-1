<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BẢNG XẾP HẠNG NDK BOT</title>
    <!-- Phông chữ Sci-Fi Orbitron & Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff0055;
            --bg-dark: #070913;
            --card-bg: rgba(16, 23, 42, 0.75);
            --border-neon: rgba(0, 240, 255, 0.4);
            --text-main: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: var(--bg-dark); 
            /* Hình nền Robot Chiến Binh Cyberpunk cao cấp */
            background-image: 
                radial-gradient(circle at center, rgba(7, 9, 19, 0.4) 0%, rgba(7, 9, 19, 0.85) 100%),
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop');
            background-repeat: no-repeat;
            background-position: center top;
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-main); 
            text-align: center; 
            padding: 30px 20px; 
            min-height: 100vh;
            user-select: none; 
            -webkit-user-select: none;
        }
        
        /* Tiêu đề Mecha / Robot */
        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 40px; 
            text-shadow: 
                0 0 10px rgba(0, 240, 255, 0.8),
                0 0 20px rgba(0, 240, 255, 0.4),
                0 0 40px rgba(0, 240, 255, 0.2);
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            box-shadow: 0 0 10px var(--primary);
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* Khung chứa ảnh thiết kế Cyber Card */
        .image-container {
            position: relative;
            width: 310px;
            cursor: pointer; 
            overflow: hidden;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-neon);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            content-visibility: auto; 
            contain-intrinsic-size: 310px 175px;
        }

        .image-container:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 
                0 12px 25px rgba(0, 240, 255, 0.3),
                0 0 15px rgba(0, 240, 255, 0.2) inset;
        }

        .image-container img { 
            width: 100%; 
            height: auto; 
            display: block;
            transition: transform 0.5s ease;
            background-color: rgba(0, 0, 0, 0.4);
            -webkit-user-drag: none;
        }

        .image-container:hover img {
            transform: scale(1.08);
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,240,255,0.05) 100%);
            pointer-events: none;
        }

        /* Huy hiệu số thứ tự dạng Mecha Tag */
        .image-number {
            position: absolute;
            top: 12px;
            left: 12px;
            font-family: 'Orbitron', sans-serif;
            background: rgba(7, 9, 19, 0.85);
            color: var(--primary); 
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none; 
            border: 1px solid var(--primary);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            z-index: 10;
        }

        /* Lightbox nâng cấp */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 5, 12, 0.92);
            backdrop-filter: blur(12px);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000; 
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 88vh;
            border-radius: 8px;
            border: 1px solid var(--primary);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            -webkit-user-drag: none;
        }

        .lightbox-overlay.active .lightbox-image {
            transform: scale(1);
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1010;
            transition: color 0.2s, transform 0.2s;
        }

        .close-lightbox:hover {
            color: var(--primary);
            transform: scale(1.2);
        }

        /* Frame Cảnh báo DevTools */
        #devtools-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #05050a;
            color: var(--secondary);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: bold;
            padding: 20px;
            box-sizing: border-box;
            text-shadow: 0 0 15px var(--secondary);
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .image-container { width: 100%; max-width: 340px; }
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <!-- CẢNH BÁO MỞ F12 -->
    <div id="devtools-warning">
        <p>⚠️ CẢNH BÁO BẢO MẬT</p>
        <p style="color: #fff; font-size: 16px; font-family: 'Be Vietnam Pro', sans-serif; font-weight: normal; margin-top: 15px;">
            Vui lòng tắt DevTools (F12) để tiếp tục truy cập nội dung!
        </p>
    </div>

    <div id="main-content">
        <h1>BẢNG XẾP HẠNG NDK BOT</h1>
        <div class="gallery" id="gallery-container"></div>
    </div>

    <!-- KHUNG LIGHTBOX -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <div class="lightbox-wrapper">
            <img src="" alt="Ảnh lớn" class="lightbox-image" id="lightbox-img">
            <div class="image-overlay"></div>
        </div>
    </div>

    <script>
        const warningEl = document.getElementById('devtools-warning');
        const mainContentEl = document.getElementById('main-content');
        const gallery = document.getElementById('gallery-container');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        const blobCache = {};

        // Phát hiện DevTools F12
        function detectDevTools() {
            const threshold = 160;
            const widthDiff = window.outerWidth - window.innerWidth > threshold;
            const heightDiff = window.outerHeight - window.innerHeight > threshold;
            
            if (widthDiff || heightDiff) {
                warningEl.style.display = 'flex';
                mainContentEl.style.display = 'none';
            } else {
                warningEl.style.display = 'none';
                mainContentEl.style.display = 'block';
            }
        }

        window.addEventListener('resize', detectDevTools);
        setInterval(detectDevTools, 1000);

        // Fetch ảnh và khởi tạo Blob URL
        async function fetchAndCreateBlobUrl(imageSrc) {
            try {
                const response = await fetch(imageSrc);
                if (!response.ok) return null;
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                blobCache[imageSrc] = blobUrl;
                return blobUrl;
            } catch (e) {
                return null;
            }
        }

        const fragment = document.createDocumentFragment();

        for (let i = 1; i <= 200; i++) {
            const div = document.createElement('div');
            div.className = 'image-container';

            const fileName = i + '.png';

            const img = document.createElement('img');
            img.alt = 'Bảng ' + i;
            img.loading = 'lazy';

            fetchAndCreateBlobUrl(fileName).then(blobUrl => {
                if (blobUrl) {
                    img.src = blobUrl;
                } else {
                    div.style.display = 'none';
                }
            });

            div.onclick = function() {
                if (blobCache[fileName]) {
                    openLightbox(blobCache[fileName]);
                }
            };

            const overlay = document.createElement('div');
            overlay.className = 'image-overlay';

            const numberSpan = document.createElement('span');
            numberSpan.className = 'image-number';
            numberSpan.innerText = '#' + (i < 10 ? '0' + i : i); 

            div.appendChild(img);
            div.appendChild(overlay);
            div.appendChild(numberSpan);
            fragment.appendChild(div);
        }

        gallery.appendChild(fragment);

        function openLightbox(blobUrl) {
            lightboxImg.src = blobUrl; 
            lightbox.classList.add('active'); 
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.classList.remove('active'); 
            document.body.style.overflow = ''; 
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        }

        closeBtn.onclick = closeLightbox;

        lightbox.onclick = function(e) {
            if (e.target !== lightboxImg) {
                closeLightbox();
            }
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
