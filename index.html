<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LỊCH SỬ BẢNG XẾP HẠNG</title>
    <style>
        /* --- GIAO DIỆN DARK MODE CAO CẤP --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #080b10; 
            color: #9ba1b0; 
            padding: 20px 16px;
            user-select: none;
        }

        /* Header Bar: Logo bên trái, Chữ ở giữa, Stats ở phải */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
        }

        /* Logo với viền Glowing Neon cao cấp */
        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00e5ff, rgba(0, 229, 255, 0.2), #38bdf8);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .header-logo img {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background-color: #080b10;
        }

        /* Chữ NDKBOT STUDIO Phông Chữ Gaming/Cyberpunk ở giữa */
        .brand-title {
            font-family: 'Arial Black', -apple-system, sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff 0%, #00e5ff 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
            text-align: center;
            white-space: nowrap;
        }

        /* Badge đếm số lượng góc phải */
        .stats-badge {
            background: linear-gradient(135deg, #101a26, #0d1520);
            color: #00e5ff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
            white-space: nowrap;
        }

        /* Tiêu đề & Thanh tìm kiếm */
        .title {
            color: #8c9ba5;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            max-width: 250px;
        }

        .search-input-wrapper input {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px 12px 10px 36px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-input-wrapper input:focus {
            border-color: #00e5ff;
        }

        .search-input-wrapper input::placeholder {
            color: #475569;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            opacity: 0.5;
            stroke: #9ba1b0;
        }

        .filter-btn {
            width: 70px;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
        }

        /* Danh sách Bảng Xếp Hạng */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .bxh-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 10px;
            background: linear-gradient(145deg, #0d131f, #0a0f18);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .bxh-item:hover {
            border-color: rgba(0, 229, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.1);
        }

        /* Khung hiển thị ảnh viền Game/Cyberpunk */
        .image-container {
            position: relative;
            width: 200px;
            height: 115px;
            background-color: #121820;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            padding: 2px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.5), rgba(30, 41, 59, 0.8), rgba(0, 229, 255, 0.2));
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            content-visibility: auto;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            transition: transform 0.4s ease;
        }

        .image-container:hover img {
            transform: scale(1.05);
        }

        /* Badge số thứ tự đè góc ảnh */
        .image-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(10, 15, 26, 0.85);
            color: #00e5ff;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(0, 229, 255, 0.4);
            backdrop-filter: blur(4px);
        }

        /* Thông tin chi tiết bên phải ảnh */
        .bxh-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            padding-top: 6px;
        }

        .bxh-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .bxh-tag {
            background-color: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* --- LIGHTBOX (XEM ẢNH PHÓNG TO) --- */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Bar: Logo góc trái | Chữ ở giữa | Thống kê góc phải -->
    <div class="header-bar">
        <div class="header-logo">
            <img src="https://i.ibb.co/fYyQBxgr/400.png" alt="Studio NDK Logo">
        </div>
        <div class="brand-title">NDKBOT STUDIO</div>
        <div class="stats-badge" id="stats-count">0 / 0 bảng</div>
    </div>

    <div class="title">LỊCH SỬ BẢNG XẾP HẠNG</div>

    <!-- Thanh tìm kiếm -->
    <div class="search-container">
        <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Tìm số BXH..." oninput="filterBXH()">
        </div>
        <div class="filter-btn"></div>
    </div>

    <!-- Danh sách BXH -->
    <div class="gallery" id="gallery-container"></div>

    <!-- Xem ảnh lớn -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <img src="" alt="BXH Chi Tiết" class="lightbox-image" id="lightbox-img">
    </div>

    <script>
        const MAX_CHECK = 200;
        const gallery = document.getElementById('gallery-container');
        const statsCount = document.getElementById('stats-count');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        let validImageCount = 0;

        function checkImageExists(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = src;
            });
        }

        async function loadGallery() {
            const fragment = document.createDocumentFragment();

            for (let i = 1; i <= MAX_CHECK; i++) {
                const imgSrc = i + '.png';
                const exists = await checkImageExists(imgSrc);

                if (exists) {
                    validImageCount++;

                    const item = document.createElement('div');
                    item.className = 'bxh-item';
                    item.setAttribute('data-id', i);

                    item.innerHTML = `
                        <div class="image-container" onclick="openLightbox('${imgSrc}')">
                            <img src="${imgSrc}" loading="lazy" decoding="async" alt="BXH #${i}">
                            <div class="image-number">${i}</div>
                        </div>
                        <div class="bxh-info">
                            <div class="bxh-title">BXH #${i}</div>
                            <div class="bxh-tag">BXH #${i}</div>
                        </div>
                    `;

                    fragment.appendChild(item);
                } else {
                    break; 
                }
            }

            gallery.appendChild(fragment);
            statsCount.innerText = `${validImageCount} / ${validImageCount} bảng`;
        }

        function filterBXH() {
            const value = document.getElementById('search-input').value.trim();
            const items = document.querySelectorAll('.bxh-item');

            items.forEach(item => {
                const id = item.getAttribute('data-id');
                if (value === '' || id === value) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            lightboxImg.src = '';
        }

        closeBtn.onclick = closeLightbox;
        lightbox.onclick = (e) => { if (e.target !== lightboxImg) closeLightbox(); };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
        });

        loadGallery();
    </script>
</body>
</html>
