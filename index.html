<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LỊCH SỬ BẢNG XẾP HẠNG - ROBOT WARRIOR ULTRA VIP 2026</title>
    <style>
        /* --- BIẾN MÀU CYBERPUNK MECHA ULTRA VIP --- */
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-gold: #ffd700;
            --neon-purple: #9d00ff;
            --bg-dark: #020408;
            --card-bg: rgba(10, 16, 28, 0.75);
            --border-glow: rgba(0, 243, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body { 
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark); 
            color: #c0caf5; 
            padding: 20px 16px 50px 16px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(157, 0, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 0% 50%, rgba(255, 0, 85, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Lưới Cyber Grid Nền */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        /* --- OVERLAY XÁC NHẬN CON NGƯỜI (HUMAN VERIFICATION CAPTCHA) --- */
        .verify-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.96);
            backdrop-filter: blur(20px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .verify-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .verify-box {
            background: linear-gradient(135deg, rgba(14, 22, 38, 0.95), rgba(6, 10, 18, 0.98));
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.15);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        .verify-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .verify-desc {
            font-size: 13px;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta);
            display: none;
        }

        .verify-box.scanning .scan-line {
            display: block;
            animation: scanAnim 1.2s infinite ease-in-out;
        }

        @keyframes scanAnim {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .captcha-badge {
            background: rgba(0, 243, 255, 0.1);
            border: 1px dashed var(--neon-cyan);
            padding: 12px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--neon-gold);
            margin-bottom: 20px;
            text-shadow: 0 0 12px var(--neon-gold);
        }

        .verify-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            border: none;
            color: #ffffff;
            padding: 14px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: all 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            background: linear-gradient(90deg, var(--neon-magenta), var(--neon-cyan));
        }

        /* --- BANNER HEADER MECHA ULTRA VIP --- */
        .vip-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 12, 22, 0.85);
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 24px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.15);
            backdrop-filter: blur(16px);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
        }

        .vip-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-gold), var(--neon-cyan));
            background-size: 300% 100%;
            animation: moveGradient 4s linear infinite;
        }

        .stats-badge {
            background: rgba(0, 243, 255, 0.12);
            color: var(--neon-cyan);
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 900;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge::before {
            content: '';
            width: 8px; height: 8px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: pulseEye 1s infinite alternate;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, var(--neon-cyan), var(--neon-magenta), #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveGradient 3s linear infinite;
            filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.6));
            text-align: center;
        }

        /* Tiêu đề & Thanh tìm kiếm Cyber HUD */
        .title {
            color: var(--neon-cyan);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title::before {
            content: '';
            width: 10px; height: 10px;
            background: var(--neon-magenta);
            box-shadow: 0 0 12px var(--neon-magenta);
            transform: rotate(45deg);
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            max-width: 360px;
        }

        .search-input-wrapper input {
            width: 100%;
            background: rgba(10, 16, 30, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 8px;
            padding: 12px 14px 12px 42px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }

        .search-input-wrapper input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6), inset 0 0 10px rgba(0, 243, 255, 0.3);
            background: rgba(15, 23, 42, 0.95);
        }

        .search-input-wrapper input::placeholder {
            color: #475569;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--neon-cyan);
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        /* --- DANH SÁCH BẢNG XẾP HẠNG MECHA WARRIOR --- */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 200px;
        }

        .bxh-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(14, 22, 38, 0.9), rgba(6, 10, 18, 0.95));
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7);
            clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
            backdrop-filter: blur(10px);
        }

        /* Viền Neon Trái Dynamic */
        .bxh-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 5px; height: 100%;
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-magenta));
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Tia Laser Hologram Quét Qua */
        .bxh-item::after {
            content: '';
            position: absolute;
            top: -150%; left: -150%;
            width: 400%; height: 400%;
            background: linear-gradient(135deg, transparent 45%, rgba(0, 243, 255, 0.25) 50%, rgba(255, 0, 85, 0.25) 53%, transparent 58%);
            transition: all 0.8s ease;
            pointer-events: none;
        }

        .bxh-item:hover::after {
            top: 100%; left: 100%;
        }

        .bxh-item:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.45), 0 0 15px rgba(255, 0, 85, 0.3);
        }

        /* KHUNG ẢNH KHỐI MECHA ROBOT */
        .image-container {
            position: relative;
            width: 220px;
            height: 125px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            padding: 2px;
            background: linear-gradient(135deg, var(--neon-cyan), rgba(15, 23, 42, 0.8), var(--neon-magenta));
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.35);
            transition: all 0.3s ease;
        }

        .image-container::before {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            background: var(--neon-magenta);
            box-shadow: 0 0 10px var(--neon-magenta);
            z-index: 3;
            border-radius: 50%;
            animation: pulseEye 1.2s infinite alternate;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 6px;
            transition: transform 0.5s cubic-bezier(0.2, 1, 0.2, 1), filter 0.3s ease;
        }

        .image-container:hover img {
            transform: scale(1.1);
            filter: brightness(1.15) contrast(1.1);
        }

        /* HUD Số Thứ Tự BXH Cyber */
        .image-number {
            position: absolute;
            top: 8px; left: 8px;
            background: rgba(3, 6, 12, 0.9);
            color: var(--neon-cyan);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 900;
            border: 1px solid var(--neon-cyan);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
            letter-spacing: 1.5px;
            z-index: 2;
        }

        /* THÔNG TIN BXH ROBOT */
        .bxh-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            overflow: hidden;
            flex-grow: 1;
        }

        .bxh-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        .bxh-subtext {
            font-size: 11px;
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            font-family: monospace;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bxh-subtext::before {
            content: '';
            width: 6px; height: 6px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ff66;
        }

        /* --- THẺ LỜI CHÚC VIP NDKBOT (CYBER TẾT NEON GOLD 2026) --- */
        .thanks-footer-card {
            margin-top: 25px;
            padding: 28px 24px;
            background: linear-gradient(135deg, rgba(35, 10, 20, 0.95), rgba(15, 5, 25, 0.98));
            border: 2px solid var(--neon-gold);
            border-radius: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.35), inset 0 0 25px rgba(255, 0, 85, 0.25);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        .thanks-footer-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, transparent 65%);
            animation: pulseEye 2s infinite alternate;
        }

        .thanks-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff4500, var(--neon-gold), #ff007f, var(--neon-gold), #ff4500);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveGradient 3s linear infinite;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
            position: relative;
            z-index: 2;
        }

        .thanks-subtext {
            margin-top: 10px;
            font-size: 14px;
            color: #ffeaa7;
            font-weight: 800;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 12px rgba(255, 234, 167, 0.6);
        }

        /* ANIMATIONS */
        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        @keyframes pulseEye {
            0% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        /* --- SKELETON LOADER --- */
        .skeleton {
            background: linear-gradient(90deg, #080d1a 25%, #121c33 50%, #080d1a 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.2s infinite;
            border-radius: 12px;
        }

        .skeleton-item {
            height: 150px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* --- LIGHTBOX (XEM ẢNH CYBER VIP) --- */
        .lightbox-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(2, 4, 8, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(15px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-image {
            max-width: 92%;
            max-height: 90vh;
            border-radius: 12px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.5), 0 0 25px rgba(255, 0, 85, 0.4);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lightbox-overlay.active .lightbox-image {
            transform: scale(1);
        }

        .close-lightbox {
            position: absolute;
            top: 24px; right: 32px;
            color: var(--neon-cyan);
            font-size: 40px;
            cursor: pointer;
            text-shadow: 0 0 15px var(--neon-cyan);
            transition: all 0.2s ease;
            font-family: sans-serif;
        }

        .close-lightbox:hover {
            color: var(--neon-magenta);
            transform: scale(1.2) rotate(90deg);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- OVERLAY XÁC NHẬN CON NGƯỜI (HUMAN VERIFICATION) -->
    <div class="verify-overlay" id="verify-overlay">
        <div class="verify-box" id="verify-box">
            <div class="scan-line"></div>
            <div class="verify-title">🛡️ HUMAN VERIFICATION</div>
            <div class="verify-desc">XÁC NHẬN SINH TRẮC CON NGƯỜI ĐỂ TRUY CẬP SYSTEM</div>
            <div class="captcha-badge" id="captcha-code">MECHA-2026</div>
            <button class="verify-btn" onclick="verifyHuman()">XÁC NHẬN TÔI LÀ CON NGƯỜI</button>
        </div>
    </div>

    <!-- Header Robot VIP -->
    <div class="vip-header">
        <div class="stats-badge" id="stats-count">0 / 0 BẢNG</div>
        <div class="brand-title">NDKBOT STUDIO VIP</div>
    </div>

    <div class="title">LỊCH SỬ BẢNG XẾP HẠNG MECHA</div>

    <!-- Thanh tìm kiếm -->
    <div class="search-container">
        <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Nhập số BẢNG (VD: 1, 2, 3...)" oninput="filterBXH()">
        </div>
    </div>

    <!-- Danh sách các BẢNG XẾP HẠNG -->
    <div class="gallery" id="gallery-container"></div>

    <!-- Lightbox Xem ảnh lớn -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <img src="" alt="Chi Tiết" class="lightbox-image" id="lightbox-img">
    </div>

    <script>
        const MAX_CHECK = 200;
        const BATCH_SIZE = 15;
        const gallery = document.getElementById('gallery-container');
        const statsCount = document.getElementById('stats-count');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        let validItems = [];
        let loadedCount = 0;

        // XỬ LÝ XÁC NHẬN CON NGƯỜI (HUMAN VERIFICATION)
        function verifyHuman() {
            const verifyBox = document.getElementById('verify-box');
            const overlay = document.getElementById('verify-overlay');
            
            verifyBox.classList.add('scanning');
            const btn = verifyBox.querySelector('.verify-btn');
            btn.innerText = "ĐANG QUÉT SINH TRẮC...";
            btn.style.pointerEvents = "none";

            setTimeout(() => {
                sessionStorage.setItem('is_human_verified', 'true');
                overlay.classList.add('hidden');
                loadGalleryUltraFast();
            }, 1200);
        }

        // KIỂM TRA TRẠNG THÁI XÁC MINH TRƯỚC
        function checkVerification() {
            const isVerified = sessionStorage.getItem('is_human_verified');
            if (isVerified === 'true') {
                document.getElementById('verify-overlay').classList.add('hidden');
                loadGalleryUltraFast();
            } else {
                // Tạo mã captcha ngẫu nhiên sinh động
                const randomCode = Math.floor(1000 + Math.random() * 9000);
                document.getElementById('captcha-code').innerText = `ROBOT-${randomCode}`;
            }
        }

        // HIỂN THỊ SKELETON LOADER
        function showSkeletons() {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 5; i++) {
                const skel = document.createElement('div');
                skel.className = 'skeleton skeleton-item';
                fragment.appendChild(skel);
            }
            gallery.appendChild(fragment);
        }

        // KIỂM TRA ẢNH TỒN TẠI
        function checkImageExists(id) {
            return new Promise((resolve) => {
                const imgSrc = `${id}.png`;
                const img = new Image();
                img.onload = () => resolve({ id, src: imgSrc, exists: true });
                img.onerror = () => resolve({ id, src: imgSrc, exists: false });
                img.src = imgSrc;
            });
        }

        // FETCH VÀ CACHE ẢNH ULTRA FAST
        async function fetchValidImages() {
            const cached = localStorage.getItem('ndk_bxh_cache_v2');
            if (cached) {
                const cacheData = JSON.parse(cached);
                if (Date.now() - cacheData.timestamp < 300000) { // Cache trong 5 phút
                    return cacheData.items;
                }
            }

            const checkPromises = [];
            for (let i = 1; i <= MAX_CHECK; i++) {
                checkPromises.push(checkImageExists(i));
            }

            const results = await Promise.all(checkPromises);
            const valid = [];
            for (const res of results) {
                if (res.exists) {
                    valid.push(res);
                } else {
                    break;
                }
            }

            localStorage.setItem('ndk_bxh_cache_v2', JSON.stringify({
                timestamp: Date.now(),
                items: valid
            }));

            return valid;
        }

        // RENDER TỪNG BATCH ẢNH
        function renderNextBatch() {
            if (loadedCount >= validItems.length) return;

            const fragment = document.createDocumentFragment();
            const nextBatch = validItems.slice(loadedCount, loadedCount + BATCH_SIZE);

            nextBatch.forEach(({ id, src }) => {
                const item = document.createElement('div');
                item.className = 'bxh-item';
                item.setAttribute('data-id', id);

                item.innerHTML = `
                    <div class="image-container" onclick="openLightbox('${src}')">
                        <img src="${src}" loading="lazy" decoding="async" alt="Bảng Xếp Hạng #${id}">
                        <div class="image-number">#${id}</div>
                    </div>
                    <div class="bxh-info">
                        <div class="bxh-title">BẢNG XẾP HẠNG #${id}</div>
                        <div class="bxh-subtext">MECHA CORE STATUS: ONLINE</div>
                    </div>
                `;
                fragment.appendChild(item);
            });

            gallery.appendChild(fragment);
            loadedCount += nextBatch.length;

            if (loadedCount >= validItems.length && !document.getElementById('thanks-card')) {
                renderThanksFooter();
            }
        }

        // LỜI CHÚC TẾT / NĂM MỚI TẠI FOOTER
        function renderThanksFooter() {
            const footerCard = document.createElement('div');
            footerCard.id = 'thanks-card';
            footerCard.className = 'thanks-footer-card';
            footerCard.innerHTML = `
                <div class="thanks-text">🧧 NDKBOT THANKS CHÚC AE VUI VẺ! 🧧</div>
                <div class="thanks-subtext">✨ AN KHANG THỊNH VƯỢNG - VẠN SỰ NHƯ Ý ✨</div>
            `;
            gallery.appendChild(footerCard);
        }

        // KHỞI CHẠY LÊN TRANG ULTRA FAST
        async function loadGalleryUltraFast() {
            showSkeletons();
            validItems = await fetchValidImages();

            gallery.innerHTML = '';
            statsCount.innerText = `${validItems.length} / ${validItems.length} BẢNG`;

            renderNextBatch();

            setTimeout(() => {
                while (loadedCount < validItems.length) {
                    renderNextBatch();
                }
            }, 50);
        }

        // LỌC THEO SỐ BẢNG XẾP HẠNG
        function filterBXH() {
            const value = document.getElementById('search-input').value.trim();
            const items = document.querySelectorAll('.bxh-item');
            const thanksCard = document.getElementById('thanks-card');

            items.forEach(item => {
                const id = item.getAttribute('data-id');
                if (value === '' || id === value) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });

            if (thanksCard) {
                thanksCard.style.display = value === '' ? 'block' : 'none';
            }
        }

        // CHỨC NĂNG LIGHTBOX
        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        }

        closeBtn.onclick = closeLightbox;
        lightbox.onclick = (e) => { if (e.target !== lightboxImg) closeLightbox(); };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });

        // Khởi động kiểm tra bảo mật
        checkVerification();
    </script>
</body>
</html>
