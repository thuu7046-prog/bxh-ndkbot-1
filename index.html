<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LỊCH SỬ BẢNG XẾP HẠNG</title>
    <style>
        /* --- GIAO DIỆN DARK MODE THEO BẢN MẪU --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14; 
            color: #9ba1b0; 
            padding: 24px 16px;
            user-select: none;
        }

        /* Thanh trên cùng: Đếm số lượng bảng */
        .header-stats {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .stats-badge {
            background-color: #16202c;
            color: #00e5ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        /* Tiêu đề & Thanh tìm kiếm */
        .title {
            color: #8c9ba5;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            max-width: 250px;
        }

        .search-input-wrapper input {
            width: 100%;
            background-color: #121820;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px 12px 10px 36px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .search-input-wrapper input::placeholder {
            color: #475569;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            opacity: 0.5;
        }

        .filter-btn {
            width: 80px;
            background-color: #121820;
            border: 1px solid #1e293b;
            border-radius: 8px;
        }

        /* Danh sách Bảng Xếp Hạng */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .bxh-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        /* Khung hiển thị ảnh */
        .image-container {
            position: relative;
            width: 220px;
            height: 125px;
            background-color: #121820;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            border: 1px solid #1e293b;
            content-visibility: auto;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Số thứ tự đè góc trên bên trái ảnh */
        .image-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Thông tin chi tiết bên phải ảnh */
        .bxh-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding-top: 4px;
        }

        .bxh-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        .bxh-tag {
            background-color: #1e293b;
            color: #38bdf8;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* --- LIGHTBOX (XEM ẢNH PHÓNG TO) --- */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Đếm tổng số bảng -->
    <div class="header-stats">
        <div class="stats-badge" id="stats-count">0 / 0 bảng</div>
    </div>

    <div class="title">LỊCH SỬ BẢNG XẾP HẠNG</div>

    <!-- Thanh tìm kiếm -->
    <div class="search-container">
        <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Tìm số BXH..." oninput="filterBXH()">
        </div>
        <div class="filter-btn"></div>
    </div>

    <!-- Danh sách các BXH -->
    <div class="gallery" id="gallery-container"></div>

    <!-- Xem ảnh lớn -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <img src="" alt="BXH Chi Tiết" class="lightbox-image" id="lightbox-img">
    </div>

    <script>
        const MAX_CHECK = 200; // Giới hạn kiểm tra ảnh tối đa
        const gallery = document.getElementById('gallery-container');
        const statsCount = document.getElementById('stats-count');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        let validImageCount = 0;

        // Hàm kiểm tra xem file ảnh có tồn tại thực sự hay không
        function checkImageExists(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = src;
            });
        }

        async function loadGallery() {
            const fragment = document.createDocumentFragment();

            for (let i = 1; i <= MAX_CHECK; i++) {
                const imgSrc = i + '.png';
                const exists = await checkImageExists(imgSrc);

                if (exists) {
                    validImageCount++;

                    const item = document.createElement('div');
                    item.className = 'bxh-item';
                    item.setAttribute('data-id', i);

                    item.innerHTML = `
                        <div class="image-container" onclick="openLightbox('${imgSrc}')">
                            <img src="${imgSrc}" loading="lazy" decoding="async" alt="BXH #${i}">
                            <div class="image-number">${i}</div>
                        </div>
                        <div class="bxh-info">
                            <div class="bxh-title">BXH #${i}</div>
                            <div class="bxh-tag">BXH #${i}</div>
                        </div>
                    `;

                    fragment.appendChild(item);
                } else {
                    // Nếu gặp ảnh không tồn tại, ngừng vòng lặp đếm
                    break; 
                }
            }

            gallery.appendChild(fragment);

            // Cập nhật số lượng đếm thực tế (VD: "18 / 18 bảng")
            statsCount.innerText = `${validImageCount} / ${validImageCount} bảng`;
        }

        // Chức năng Tìm kiếm theo số BXH
        function filterBXH() {
            const value = document.getElementById('search-input').value.trim();
            const items = document.querySelectorAll('.bxh-item');

            items.forEach(item => {
                const id = item.getAttribute('data-id');
                if (value === '' || id === value) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // --- XỬ LÝ LIGHTBOX ---
        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            lightboxImg.src = '';
        }

        closeBtn.onclick = closeLightbox;
        lightbox.onclick = (e) => { if (e.target !== lightboxImg) closeLightbox(); };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
        });

        // Bắt đầu tải danh sách
        loadGallery();
    </script>
</body>
</html>
