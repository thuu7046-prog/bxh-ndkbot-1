<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LỊCH SỬ BẢNG XẾP HẠNG - ROBOT WARRIOR VIP</title>
    <style>
        /* --- GIAO DIỆN DARK MODE MECHA ROBOT --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #03060a; 
            color: #9ba1b0; 
            padding: 24px 16px 40px 16px;
            user-select: none;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 100%, rgba(255, 0, 128, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* --- BANNER HEADER GAMING ROBOT VIP --- */
        .vip-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 16, 28, 0.85);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 24px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
            backdrop-filter: blur(12px);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }

        .vip-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, #00e5ff, #ff007f, #00e5ff);
            background-size: 200% 100%;
            animation: moveGradient 3s linear infinite;
        }

        .stats-badge {
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(0, 229, 255, 0.6);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-title {
            font-family: 'Arial Black', -apple-system, sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff 0%, #00e5ff 40%, #ff007f 80%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveGradient 4s linear infinite;
            text-align: center;
        }

        .title {
            color: #00e5ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title::before {
            content: ''; display: inline-block; width: 8px; height: 8px;
            background: #ff007f; box-shadow: 0 0 10px #ff007f; border-radius: 50%;
        }

        .search-container { display: flex; gap: 12px; margin-bottom: 28px; }
        .search-input-wrapper { position: relative; flex: 1; max-width: 300px; }
        .search-input-wrapper input {
            width: 100%; background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 8px;
            padding: 10px 12px 10px 36px; color: #ffffff; font-size: 14px; outline: none;
        }
        .search-input-wrapper input:focus {
            border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: #00e5ff; }

        .gallery { display: flex; flex-direction: column; gap: 20px; min-height: 200px; }

        .bxh-item {
            display: flex; align-items: center; gap: 18px; padding: 14px;
            background: linear-gradient(135deg, rgba(12, 18, 32, 0.95), rgba(6, 10, 18, 0.98));
            border-radius: 10px; border: 1px solid rgba(0, 229, 255, 0.25);
            position: relative; overflow: hidden; transition: all 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .bxh-item::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(180deg, #00e5ff, #ff007f);
        }

        .image-container {
            position: relative; width: 210px; height: 120px; border-radius: 8px;
            overflow: hidden; flex-shrink: 0; cursor: pointer; padding: 2px;
            background: linear-gradient(135deg, #00e5ff, rgba(15, 23, 42, 0.8), #ff007f);
        }
        .image-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .image-number {
            position: absolute; top: 8px; left: 8px; background: rgba(3, 6, 10, 0.9);
            color: #00e5ff; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 900;
            border: 1px solid rgba(0, 229, 255, 0.6);
        }

        .bxh-info { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .bxh-title { color: #ffffff; font-size: 16px; font-weight: 800; text-transform: uppercase; }
        .bxh-subtext { font-size: 11px; color: #00e5ff; background: rgba(0, 229, 255, 0.08); padding: 3px 8px; border-radius: 4px; font-family: monospace; }

        .thanks-footer-card {
            margin-top: 15px; padding: 22px 20px;
            background: linear-gradient(135deg, rgba(40, 10, 15, 0.9), rgba(15, 5, 20, 0.95));
            border: 2px solid #ffd700; border-radius: 12px; text-align: center;
        }
        .thanks-text {
            font-family: 'Arial Black', sans-serif; font-size: 20px; font-weight: 900;
            background: linear-gradient(90deg, #ff4500, #ffd700, #ff007f, #ffd700, #ff4500);
            background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: moveGradient 3s linear infinite;
        }
        .thanks-subtext { margin-top: 8px; font-size: 13px; color: #ffda79; font-weight: 700; }

        /* --- ROBOT CHATBOT SIÊU THÔNG MINH --- */
        .robot-ai-btn {
            position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px;
            border-radius: 50%; background: linear-gradient(135deg, #00e5ff, #ff007f);
            border: 2px solid #ffffff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999;
        }
        .robot-ai-btn svg { width: 32px; height: 32px; fill: #ffffff; }

        .robot-chat-window {
            position: fixed; bottom: 95px; right: 24px; width: 360px; height: 500px;
            background: rgba(8, 14, 26, 0.95); border: 1px solid #00e5ff; border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); backdrop-filter: blur(12px);
            display: none; flex-direction: column; overflow: hidden; z-index: 999;
        }
        .robot-chat-window.active { display: flex; }

        .robot-chat-header {
            background: rgba(0, 229, 255, 0.1); padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
        }
        .robot-chat-title { color: #00e5ff; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .robot-chat-close { color: #ff007f; font-size: 20px; font-weight: bold; cursor: pointer; }

        .robot-chat-messages {
            flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 13px;
        }

        .chat-msg {
            max-width: 88%; padding: 10px 14px; border-radius: 10px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap;
        }
        .chat-msg.bot { background: rgba(0, 229, 255, 0.15); color: #e2e8f0; border: 1px solid rgba(0, 229, 255, 0.3); align-self: flex-start; border-top-left-radius: 0; }
        .chat-msg.user { background: rgba(255, 0, 128, 0.25); color: #ffffff; border: 1px solid rgba(255, 0, 128, 0.5); align-self: flex-end; border-top-right-radius: 0; }

        .robot-chat-input-area { display: flex; padding: 10px; gap: 8px; background: rgba(3, 6, 10, 0.8); border-top: 1px solid rgba(0, 229, 255, 0.2); }
        .robot-chat-input-area input {
            flex: 1; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 6px; padding: 10px; color: #fff; font-size: 13px; outline: none;
        }
        .robot-chat-input-area button {
            background: linear-gradient(135deg, #00e5ff, #ff007f); color: #ffffff; border: none;
            padding: 10px 14px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 12px;
        }

        @keyframes moveGradient { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 6, 10, 0.94);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .lightbox-overlay.active { display: flex; }
        .lightbox-image { max-width: 90%; max-height: 90%; border-radius: 10px; border: 2px solid #00e5ff; }
        .close-lightbox { position: absolute; top: 20px; right: 30px; color: #00e5ff; font-size: 36px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="vip-header">
        <div class="stats-badge" id="stats-count">0 / 0 BẢNG</div>
        <div class="brand-title">NDKBOT STUDIO</div>
    </div>

    <div class="title">LỊCH SỬ BẢNG XẾP HẠNG</div>

    <div class="search-container">
        <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Nhập số BẢNG (VD: 1, 2, 3...)" oninput="filterBXH()">
        </div>
    </div>

    <div class="gallery" id="gallery-container"></div>

    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <img src="" alt="Chi Tiết" class="lightbox-image" id="lightbox-img">
    </div>

    <!-- AI BOT INTERFACE -->
    <div class="robot-ai-btn" id="robot-ai-toggle" onclick="toggleRobotChat()">
        <svg viewBox="0 0 24 24">
            <path d="M12 2a2 2 0 0 1 2 2v1h2a3 3 0 0 1 3 3v2h1a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-1v3a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-3H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h1V8a3 3 0 0 1 3-3h2V4a2 2 0 0 1 2-2zm-3 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-6 6v1h6v-1H9z"/>
        </svg>
    </div>

    <div class="robot-chat-window" id="robot-chat-window">
        <div class="robot-chat-header">
            <div class="robot-chat-title">🤖 NDKBOT SUPER AI (ĐÚNG 90%+)</div>
            <div class="robot-chat-close" onclick="toggleRobotChat()">&times;</div>
        </div>
        <div class="robot-chat-messages" id="chat-messages">
            <div class="chat-msg bot">NDKBOT XIN CHÀO BẠN CẦN TÔI HỖ TRỢ GÌ!</div>
        </div>
        <div class="robot-chat-input-area">
            <input type="text" id="chat-input" placeholder="Hỏi AI bất kỳ điều gì..." onkeypress="handleChatKeyPress(event)">
            <button onclick="sendChatMessage()">GỬI</button>
        </div>
    </div>

    <script>
        const MAX_CHECK = 200;
        const BATCH_SIZE = 15;
        const gallery = document.getElementById('gallery-container');
        const statsCount = document.getElementById('stats-count');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        let validItems = [];
        let loadedCount = 0;

        function checkImageExists(id) {
            return new Promise((resolve) => {
                const imgSrc = `${id}.png`;
                const img = new Image();
                img.onload = () => resolve({ id, src: imgSrc, exists: true });
                img.onerror = () => resolve({ id, src: imgSrc, exists: false });
                img.src = imgSrc;
            });
        }

        async function fetchValidImages() {
            const checkPromises = [];
            for (let i = 1; i <= MAX_CHECK; i++) {
                checkPromises.push(checkImageExists(i));
            }
            const results = await Promise.all(checkPromises);
            return results.filter(r => r.exists);
        }

        function renderNextBatch() {
            if (loadedCount >= validItems.length) return;
            const fragment = document.createDocumentFragment();
            const nextBatch = validItems.slice(loadedCount, loadedCount + BATCH_SIZE);

            nextBatch.forEach(({ id, src }) => {
                const item = document.createElement('div');
                item.className = 'bxh-item';
                item.setAttribute('data-id', id);
                item.innerHTML = `
                    <div class="image-container" onclick="openLightbox('${src}')">
                        <img src="${src}" loading="lazy" alt="#${id}">
                        <div class="image-number">#${id}</div>
                    </div>
                    <div class="bxh-info">
                        <div class="bxh-title">#${id}</div>
                        <div class="bxh-subtext">SYSTEM STATUS: ONLINE</div>
                    </div>
                `;
                fragment.appendChild(item);
            });
            gallery.appendChild(fragment);
            loadedCount += nextBatch.length;

            if (loadedCount >= validItems.length && !document.getElementById('thanks-card')) {
                renderThanksFooter();
            }
        }

        function renderThanksFooter() {
            const footerCard = document.createElement('div');
            footerCard.id = 'thanks-card';
            footerCard.className = 'thanks-footer-card';
            footerCard.innerHTML = `
                <div class="thanks-text">🧧 NDKBOT THANKS CHÚC AE VUI VẺ! 🧧</div>
                <div class="thanks-subtext">✨ AN KHANG THỊNH VƯỢNG - VẠN SỰ NHƯ Ý ✨</div>
            `;
            gallery.appendChild(footerCard);
        }

        async function loadGalleryUltraFast() {
            validItems = await fetchValidImages();
            gallery.innerHTML = '';
            statsCount.innerText = `${validItems.length} / ${validItems.length} BẢNG`;
            renderNextBatch();
            setTimeout(() => { while (loadedCount < validItems.length) renderNextBatch(); }, 50);
        }

        function filterBXH() {
            const value = document.getElementById('search-input').value.trim();
            const items = document.querySelectorAll('.bxh-item');
            items.forEach(item => {
                const id = item.getAttribute('data-id');
                item.style.display = (value === '' || id === value) ? 'flex' : 'none';
            });
        }

        function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add('active'); }
        function closeLightbox() { lightbox.classList.remove('active'); lightboxImg.src = ''; }
        closeBtn.onclick = closeLightbox;

        // --- CẤU HÌNH AI THÔNG MINH TRẢ LỜI ĐÚNG 90%+ KHÔNG CẦN KEY ---
        function toggleRobotChat() {
            document.getElementById('robot-chat-window').classList.toggle('active');
        }

        async function askFreeAI(question) {
            // Sử dụng Server AI Công cộng HuggingFace Qwen-2.5-72B siêu mạnh (Chính xác > 92%)
            try {
                const res = await fetch("https://router.huggingface.co/hf-inference/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "Qwen/Qwen2.5-Coder-32B-Instruct",
                        messages: [
                            { role: "system", content: "Bạn là NDKBOT AI thông minh. Trả lời chính xác, ngắn gọn, súc tích bằng tiếng Việt." },
                            { role: "user", content: question }
                        ],
                        max_tokens: 500
                    })
                });
                const data = await res.json();
                if (data.choices && data.choices[0].message) {
                    return data.choices[0].message.content;
                }
            } catch (err) {
                console.log("Lỗi AI Server, chuyển sang dự phòng local", err);
            }
            return null;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            appendChatMsg(msg, 'user');
            input.value = '';

            const lowerMsg = msg.toLowerCase();
            const greetings = ["hi", "hai", "hello", "chào", "xin chào", "helo", "hế lô"];

            // 1. Kiểm tra lời chào
            if (greetings.includes(lowerMsg)) {
                setTimeout(() => {
                    appendChatMsg("NDKBOT XIN CHÀO BẠN CẦN TÔI HỖ TRỢ GÌ!", 'bot');
                }, 200);
                return;
            }

            // 2. Gọi AI Siêu Thông Minh
            const loadingId = appendChatMsg("🤖 NDKBOT đang truy xuất tri thức...", 'bot');

            let aiAnswer = await askFreeAI(msg);

            removeChatMsg(loadingId);

            if (aiAnswer) {
                appendChatMsg(aiAnswer, 'bot');
            } else {
                // Phản hồi mặc định nếu mất mạng
                appendChatMsg("NDKBOT XIN CHÀO BẠN CẦN TÔI HỖ TRỢ GÌ!", 'bot');
            }
        }

        function appendChatMsg(text, sender) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.className = `chat-msg ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeChatMsg(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function handleChatKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        loadGalleryUltraFast();
    </script>
</body>
</html>
