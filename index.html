<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LỊCH SỬ BẢNG XẾP HẠNG - ROBOT WARRIOR VIP</title>
    <style>
        /* --- GIAO DIỆN DARK MODE MECHA ROBOT --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #03060a; 
            color: #9ba1b0; 
            padding: 24px 16px 40px 16px;
            user-select: none;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 100%, rgba(255, 0, 128, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* --- BANNER HEADER GAMING ROBOT VIP --- */
        .vip-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 16, 28, 0.85);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 24px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2), inset 0 0 15px rgba(0, 229, 255, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }

        .vip-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #00e5ff, #ff007f, #00e5ff);
            background-size: 200% 100%;
            animation: moveGradient 3s linear infinite;
        }

        /* Stats Badge Robot VIP */
        .stats-badge {
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(0, 229, 255, 0.6);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* NDKBOT STUDIO Text Gradient VIP */
        .brand-title {
            font-family: 'Arial Black', -apple-system, sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff 0%, #00e5ff 40%, #ff007f 80%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveGradient 4s linear infinite;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
            text-align: center;
        }

        /* Tiêu đề & Thanh tìm kiếm */
        .title {
            color: #00e5ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff007f;
            box-shadow: 0 0 10px #ff007f;
            border-radius: 50%;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            max-width: 300px;
        }

        .search-input-wrapper input {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 10px 12px 10px 36px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input-wrapper input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5), inset 0 0 8px rgba(0, 229, 255, 0.2);
        }

        .search-input-wrapper input::placeholder {
            color: #475569;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            opacity: 0.8;
            stroke: #00e5ff;
        }

        /* --- DANH SÁCH BẢNG XẾP HẠNG ROBOT CHIẾN BINH --- */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 200px;
        }

        /* THẺ ITEM CHIẾN BINH MECHA */
        .bxh-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px;
            background: linear-gradient(135deg, rgba(12, 18, 32, 0.95), rgba(6, 10, 18, 0.98));
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.25);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            /* Vết cắt Mecha Futuristic */
            clip-path: polygon(
                0 0, 
                calc(100% - 15px) 0, 
                100% 15px, 
                100% 100%, 
                15px 100%, 
                0 calc(100% - 15px)
            );
        }

        /* Viền Neon Trái */
        .bxh-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #00e5ff, #ff007f);
            box-shadow: 0 0 12px #00e5ff;
        }

        /* TIA LASER CHIẾN BINH QUÉT TỰ ĐỘNG */
        .bxh-item::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                135deg, 
                transparent 45%, 
                rgba(0, 229, 255, 0.15) 50%, 
                rgba(255, 0, 128, 0.2) 52%, 
                transparent 57%
            );
            transition: all 0.6s ease;
            pointer-events: none;
        }

        .bxh-item:hover::after {
            top: 100%;
            left: 100%;
        }

        .bxh-item:hover {
            transform: translateY(-4px) scale(1.008);
            border-color: #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.35), 0 0 10px rgba(255, 0, 128, 0.2);
        }

        /* KHUNG HIỂN THỊ ẢNH KHỐI MECHA ROBOT */
        .image-container {
            position: relative;
            width: 210px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            padding: 2px;
            background: linear-gradient(135deg, #00e5ff, rgba(15, 23, 42, 0.8), #ff007f);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            transition: all 0.3s ease;
        }

        /* Góc Mecha Futuristic trên khung ảnh */
        .image-container::before {
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            background: #ff007f;
            box-shadow: 0 0 8px #ff007f;
            z-index: 2;
            border-radius: 50%;
            animation: pulseEye 1.5s infinite alternate;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 6px;
            transition: transform 0.4s ease, filter 0.3s ease;
        }

        .image-container:hover img {
            transform: scale(1.08);
            filter: brightness(1.1) contrast(1.05);
        }

        /* MÃ SỐ BXH KÍỂU CYBER HUD */
        .image-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(3, 6, 10, 0.9);
            color: #00e5ff;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
            border: 1px solid rgba(0, 229, 255, 0.6);
            backdrop-filter: blur(6px);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
            letter-spacing: 1px;
            z-index: 2;
        }

        /* THÔNG TIN BXH ROBOT */
        .bxh-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            overflow: hidden;
            flex-grow: 1;
        }

        .bxh-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .bxh-subtext {
            font-size: 11px;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.08);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            font-family: monospace;
            letter-spacing: 1px;
        }

        /* --- THẺ LỜI CHÚC CỦA NDKBOT (HIỆU ỨNG NĂM MỚI TẾT VIP) --- */
        .thanks-footer-card {
            margin-top: 15px;
            padding: 22px 20px;
            background: linear-gradient(135deg, rgba(40, 10, 15, 0.9), rgba(15, 5, 20, 0.95));
            border: 2px solid #ffd700;
            border-radius: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 0, 80, 0.2);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .thanks-footer-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 60%);
            animation: pulseEye 2.5s infinite alternate;
        }

        .thanks-text {
            font-family: 'Arial Black', -apple-system, sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff4500, #ffd700, #ff007f, #ffd700, #ff4500);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveGradient 3s linear infinite;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            position: relative;
            z-index: 2;
        }

        .thanks-subtext {
            margin-top: 8px;
            font-size: 13px;
            color: #ffda79;
            font-weight: 700;
            letter-spacing: 1.5px;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 10px rgba(255, 218, 121, 0.5);
        }

        /* ANIMATION HIỆU ỨNG ROBOT */
        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes pulseEye {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* --- SKELETON LOADER --- */
        .skeleton {
            background: linear-gradient(90deg, #090e17 25%, #141e30 50%, #090e17 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 10px;
        }

        .skeleton-item {
            height: 144px;
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 10px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* --- LIGHTBOX (XEM ẢNH PHÓNG TO CYBER) --- */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 6, 10, 0.94);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.4), 0 0 20px rgba(255, 0, 128, 0.3);
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #00e5ff;
            font-size: 36px;
            cursor: pointer;
            text-shadow: 0 0 10px #00e5ff;
            transition: all 0.2s;
        }

        .close-lightbox:hover {
            color: #ff007f;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Header Robot VIP -->
    <div class="vip-header">
        <div class="stats-badge" id="stats-count">0 / 0 BẢNG</div>
        <div class="brand-title">NDKBOT STUDIO</div>
    </div>

    <div class="title">LỊCH SỬ BẢNG XẾP HẠNG</div>

    <!-- Thanh tìm kiếm -->
    <div class="search-container">
        <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Nhập số BXH (VD: 1, 2, 3...)" oninput="filterBXH()">
        </div>
    </div>

    <!-- Danh sách các BXH -->
    <div class="gallery" id="gallery-container"></div>

    <!-- Lightbox Xem ảnh lớn -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <img src="" alt="BXH Chi Tiết" class="lightbox-image" id="lightbox-img">
    </div>

    <script>
        const MAX_CHECK = 200;
        const BATCH_SIZE = 15;
        const gallery = document.getElementById('gallery-container');
        const statsCount = document.getElementById('stats-count');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        let validItems = [];
        let loadedCount = 0;

        // HIỂN THỊ KHUNG SKELETON
        function showSkeletons() {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 5; i++) {
                const skel = document.createElement('div');
                skel.className = 'skeleton skeleton-item';
                fragment.appendChild(skel);
            }
            gallery.appendChild(fragment);
        }

        // KIỂM TRA TỒN TẠI ẢNH (1.png, 2.png...)
        function checkImageExists(id) {
            return new Promise((resolve) => {
                const imgSrc = `${id}.png`;
                const img = new Image();
                img.onload = () => resolve({ id, src: imgSrc, exists: true });
                img.onerror = () => resolve({ id, src: imgSrc, exists: false });
                img.src = imgSrc;
            });
        }

        // NẠP DANH SÁCH ẢNH DÙNG CACHE
        async function fetchValidImages() {
            const cached = localStorage.getItem('ndk_bxh_cache');
            if (cached) {
                const cacheData = JSON.parse(cached);
                if (Date.now() - cacheData.timestamp < 300000) {
                    return cacheData.items;
                }
            }

            const checkPromises = [];
            for (let i = 1; i <= MAX_CHECK; i++) {
                checkPromises.push(checkImageExists(i));
            }

            const results = await Promise.all(checkPromises);
            const valid = [];
            for (const res of results) {
                if (res.exists) {
                    valid.push(res);
                } else {
                    break;
                }
            }

            localStorage.setItem('ndk_bxh_cache', JSON.stringify({
                timestamp: Date.now(),
                items: valid
            }));

            return valid;
        }

        // RENDER TỪNG TẬP TỆP ÁNH
        function renderNextBatch() {
            if (loadedCount >= validItems.length) return;

            const fragment = document.createDocumentFragment();
            const nextBatch = validItems.slice(loadedCount, loadedCount + BATCH_SIZE);

            nextBatch.forEach(({ id, src }) => {
                const item = document.createElement('div');
                item.className = 'bxh-item';
                item.setAttribute('data-id', id);

                item.innerHTML = `
                    <div class="image-container" onclick="openLightbox('${src}')">
                        <img src="${src}" loading="lazy" decoding="async" alt="BẢNG XẾP HẠNG #${id}">
                        <div class="image-number">#${id}</div>
                    </div>
                    <div class="bxh-info">
                        <div class="bxh-title">BẢNG XẾP HẠNG #${id}</div>
                        <div class="bxh-subtext">SYSTEM STATUS: ONLINE</div>
                    </div>
                `;
                fragment.appendChild(item);
            });

            gallery.appendChild(fragment);
            loadedCount += nextBatch.length;

            // Khi nạp xong toàn bộ BXH thì hiển thị thẻ Chúc Mừng Năm Mới ở dưới cùng
            if (loadedCount >= validItems.length && !document.getElementById('thanks-card')) {
                renderThanksFooter();
            }
        }

        // THẺ LỜI CHÚC TẾT / NĂM MỚI Ở CUỐI TRANG
        function renderThanksFooter() {
            const footerCard = document.createElement('div');
            footerCard.id = 'thanks-card';
            footerCard.className = 'thanks-footer-card';
            footerCard.innerHTML = `
                <div class="thanks-text">🧧 NDKBOT THANKS CHÚC AE VUI VẺ! 🧧</div>
                <div class="thanks-subtext">✨ AN KHANG THỊNH VƯỢNG - VẠN SỰ NHƯ Ý ✨</div>
            `;
            gallery.appendChild(footerCard);
        }

        // KHỞI CHẠY CHÍNH
        async function loadGalleryUltraFast() {
            showSkeletons();

            validItems = await fetchValidImages();

            gallery.innerHTML = '';
            statsCount.innerText = `${validItems.length} / ${validItems.length} BẢNG`;

            renderNextBatch();

            setTimeout(() => {
                while (loadedCount < validItems.length) {
                    renderNextBatch();
                }
            }, 50);
        }

        // LỌC THEO SỐ BXH
        function filterBXH() {
            const value = document.getElementById('search-input').value.trim();
            const items = document.querySelectorAll('.bxh-item');
            const thanksCard = document.getElementById('thanks-card');

            items.forEach(item => {
                const id = item.getAttribute('data-id');
                if (value === '' || id === value) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });

            // Ẩn/Hiện thẻ chúc mừng khi tìm kiếm
            if (thanksCard) {
                thanksCard.style.display = value === '' ? 'block' : 'none';
            }
        }

        // LIGHTBOX
        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            lightboxImg.src = '';
        }

        closeBtn.onclick = closeLightbox;
        lightbox.onclick = (e) => { if (e.target !== lightboxImg) closeLightbox(); };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });

        loadGalleryUltraFast();
    </script>
</body>
</html>
