<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BẢNG XẾP HẠNG NDK BOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-cyan: #00f0ff;
            --electric-blue: #0077ff;
            --dark-core: #030712;
            --card-bg: rgba(6, 15, 30, 0.88);
            --border-cyan: rgba(0, 240, 255, 0.45);
            --text-main: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--dark-core); 
            background-image: 
                radial-gradient(circle at 50% 25%, rgba(0, 240, 255, 0.15) 0%, rgba(3, 7, 18, 0.95) 85%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: cover, 35px 35px, 35px 35px;
            background-repeat: no-repeat, repeat, repeat;
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 20px; 
            min-height: 100vh;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* Thanh Top Bar chứa bộ đếm & tìm kiếm */
        .top-bar {
            max-width: 1000px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-cyan);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .counter-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: rgba(6, 15, 30, 0.9);
            border: 1px solid var(--border-cyan);
            color: var(--text-main);
            padding: 8px 16px 8px 36px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: 0.7;
        }

        /* Danh sách Bảng Xếp Hạng */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* Khung hiển thị từng hàng BXH */
        .image-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-cyan);
            padding: 12px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .image-container:hover {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: translateX(4px);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Ảnh thu nhỏ preview */
        .img-wrapper {
            position: relative;
            width: 120px;
            height: 68px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(0, 240, 255, 0.2);
            cursor: pointer;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-number {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(3, 7, 18, 0.85);
            color: var(--primary-cyan);
            padding: 2px 6px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 11px;
            font-weight: 700;
            border-radius: 3px;
            border: 1px solid var(--primary-cyan);
        }

        .item-info {
            text-align: left;
        }

        .item-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .item-tag {
            display: inline-block;
            margin-top: 4px;
            background: rgba(0, 119, 255, 0.2);
            border: 1px solid var(--electric-blue);
            color: var(--primary-cyan);
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-family: 'Chakra Petch', sans-serif;
        }

        /* Lightbox */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 4, 10, 0.95);
            backdrop-filter: blur(12px);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000; 
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 90%;
            max-height: 85vh;
            border: 1px solid var(--primary-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            border-radius: 6px;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: var(--primary-cyan);
            font-size: 40px;
            cursor: pointer;
        }

        #devtools-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #02040a;
            color: var(--primary-cyan);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <div id="devtools-warning">
        <p>⚠️ ACCESS DENIED / DEVTOOLS DETECTED</p>
    </div>

    <div id="main-content">
        <!-- Thanh công cụ điều khiển -->
        <div class="top-bar">
            <div class="header-title">LỊCH SỬ BẢNG XẾP HẠNG</div>
            <div class="controls">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Tìm số BXH..." oninput="filterBXH()">
                </div>
                <div class="counter-badge" id="counter">200 / 200 bảng</div>
            </div>
        </div>

        <!-- Danh sách chứa 200 BXH -->
        <div class="gallery" id="gallery-container"></div>
    </div>

    <!-- Lightbox Xem Ảnh Lớn -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <img src="" alt="BXH Chi Tiết" class="lightbox-image" id="lightbox-img">
    </div>

    <script>
        const TOTAL_ITEMS = 200; // Cấu hình đủ 200/200 bảng
        const gallery = document.getElementById('gallery-container');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        // Khởi tạo danh sách 200 mục trực tiếp không ẩn item nếu fetch chậm
        function initGallery() {
            const fragment = document.createDocumentFragment();

            for (let i = 1; i <= TOTAL_ITEMS; i++) {
                const div = document.createElement('div');
                div.className = 'image-container';
                div.setAttribute('data-index', i);

                const fileName = i + '.png';

                div.innerHTML = `
                    <div class="item-left">
                        <div class="img-wrapper" onclick="openLightbox('${fileName}')">
                            <img src="${fileName}" alt="BXH #${i}" onerror="this.src='https://via.placeholder.com/150x85/060f1e/00f0ff?text=BXH+${i}'">
                            <span class="image-number">${i}</span>
                        </div>
                        <div class="item-info">
                            <div class="item-title">BXH #${i}</div>
                            <span class="item-tag">BXH #${i}</span>
                        </div>
                    </div>
                `;

                fragment.appendChild(div);
            }

            gallery.appendChild(fragment);
        }

        // Tìm kiếm theo số BXH
        function filterBXH() {
            const input = document.getElementById('search-input').value.trim();
            const items = document.querySelectorAll('.image-container');
            let visibleCount = 0;

            items.forEach(item => {
                const index = item.getAttribute('data-index');
                if (input === '' || index.includes(input)) {
                    item.style.display = 'flex';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });

            document.getElementById('counter').innerText = `${visibleCount} / ${TOTAL_ITEMS} bảng`;
        }

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.onclick = closeLightbox;
        lightbox.onclick = (e) => { if (e.target !== lightboxImg) closeLightbox(); };

        // Chạy khởi tạo
        initGallery();
    </script>
</body>
</html>
